<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register & Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <link rel="shortcut icon" href="ambulance.png" type="image/x-icon" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2575fc, #ffffff);
    }

    .container {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 35px;
      width: 370px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .container h2 {
      text-align: center;
      color: #003366;
      margin-bottom: 25px;
    }

    .input-field {
      position: relative;
      margin: 15px 0;
    }

    .input-field i {
      position: absolute;
      left: 10px;
      top: 12px;
      color: #003366;
    }

    .input-field input {
      width: 100%;
      padding: 12px 12px 12px 35px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.8);
      color: #003366;
      font-size: 15px;
    }

    .form-check {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }

    .form-check-input {
      margin-right: 8px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2575fc;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #005ce6;
    }

    .social-text {
      text-align: center;
      margin: 20px 0 10px;
      color: #003366;
      font-size: 14px;
    }

    .social-media {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .social-icon {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: 0.3s;
    }

    .social-icon:hover {
      background: rgba(255, 255, 255, 0.9);
    }

    #login-error {
      color: red;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>User Login / Sign Up</h2>
    <form onsubmit="return validateForm()">
      <div class="input-field">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Username" required />
      </div>
      <div class="input-field">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="Email (for Sign Up)" />
      </div>
      <div class="input-field">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" required />
      </div>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="remember-me" />
        <label for="remember-me">Remember me</label>
      </div>
      <input type="submit" value="Continue" class="btn" />
      <div id="login-error">Invalid credentials. Try again.</div>


  <div class="container">
    <div class="forms-container">
      <div class="signin-signup">
        <form action="#" class="sign-in-form" onsubmit="return validateSignInForm()">
          <h2 class="title">Sign in</h2>
          <div class="input-field">
            <i class="fas fa-user"></i>
            <input type="text" id="username" placeholder="Username" aria-label="Username" required />
          </div>
          <div class="input-field">
            <i class="fas fa-lock" id="toggle-password"></i>
            <input type="password" placeholder="Password" id="password-input" aria-label="Password" required />
          </div>
          <div class="form-check d-flex">
            <input type="checkbox" class="form-check-input" id="remember-me" />
            <label class="form-check-label" for="remember-me">Remember me</label>
            <a id="forgot-password" style="margin-left:auto;text-decoration:none;color:#3b82f6;cursor:pointer" aria-label="Forgot password">Forgot password?</a>
          </div>
          <input type="submit" value="Login" class="btn solid" />
          <p class="social-text">Or Sign in with social platforms</p>
          <div class="social-media">
            <div class="social-icon g-signin2" id="google_btn">
              <i class="fab fa-google" style="font-size: 24px; color: #4285F4;"></i>
            </div>
            <a href="https://facebook.com/YourPage" target="_blank" class="social-icon">
              <i class="fab fa-facebook-f" style="font-size: 24px; color: #4267b2"></i>
            </a>
            <a href="https://github.com/YourGitHubProfile" target="_blank" class="social-icon">
              <i class="fab fa-github" style="font-size: 24px; color: #333"></i>
            </a>
          </div>
          <div id="login-error" style="color: red; display: none;"></div> <!-- Error message -->
        </form>

        <form action="#" class="sign-up-form" onsubmit="return validateSignUpForm()">
          <h2 class="title">Sign up</h2>
          <div class="input-field">
            <i class="fas fa-user"></i>
            <input type="text" placeholder="Username" aria-label="Username" required />
          </div>
          <div class="input-field">
            <i class="fas fa-envelope"></i>
            <input type="email" placeholder="Email" aria-label="Email" required />
          </div>
          <div class="input-field">
            <i class="fas fa-lock" id="toggle-password-signup"></i>
            <input type="password" placeholder="Password" id="password-input-signup" aria-label="Password" required />
          </div>
          <input type="submit" class="btn" value="Sign up" />
          <p class="social-text">Or Sign up with social platforms</p>
          <div class="social-media">
            <div class="social-icon g-signin2" id="google_btn">
              <i class="fab fa-google" style="font-size: 24px; color: #4285F4;"></i>
            </div>
            <a href="https://facebook.com/YourPage" target="_blank" class="social-icon">
              <i class="fab fa-facebook-f" style="font-size: 24px; color: #4267b2"></i>
            </a>
            <a href="https://github.com/YourGitHubProfile" target="_blank" class="social-icon">
              <i class="fab fa-github" style="font-size: 24px; color: #333"></i>
            </a>
          </div>
        </form>

      <p class="social-text">Or continue with</p>
      <div class="social-media">
        <div class="social-icon"><i class="fab fa-google" style="color: #4285F4; font-size: 22px;"></i></div>
        <div class="social-icon"><i class="fab fa-facebook-f" style="color: #4267b2; font-size: 22px;"></i></div>
        <div class="social-icon"><i class="fab fa-github" style="color: #333; font-size: 22px;"></i></div>

      </div>
    </form>
  </div>


  <!-- Forgot Password Modal -->
  <div id="forgot-modal" aria-hidden="true" role="dialog" aria-labelledby="forgot-title" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:12px;max-width:420px;width:92%;box-shadow:0 10px 30px rgba(0,0,0,.2);">
      <div style="padding:20px 24px;border-bottom:1px solid #eef2f7;display:flex;align-items:center;justify-content:space-between;">
        <h3 id="forgot-title" style="margin:0;font-size:18px;color:#111827;">Reset password</h3>
        <button id="forgot-close" aria-label="Close" style="border:none;background:transparent;font-size:20px;cursor:pointer;color:#6b7280">×</button>
      </div>
      <form id="forgot-form" style="padding:18px 24px;">
        <label for="forgot-email" style="display:block;font-size:14px;color:#374151;margin-bottom:8px;">Email address</label>
        <input id="forgot-email" type="email" placeholder="you@example.com" required 
               style="width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;" />
        <p id="forgot-help" style="margin:8px 0 0;font-size:12px;color:#6b7280;">We’ll send you a link to reset your password.</p>
        <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end;">
          <button type="button" id="forgot-cancel" style="padding:10px 14px;border:1px solid #d1d5db;background:#fff;border-radius:8px;cursor:pointer;">Cancel</button>
          <button type="submit" id="forgot-submit" disabled 
                  style="padding:10px 16px;border:none;background:#2563eb;color:#fff;border-radius:8px;cursor:not-allowed;">Send reset link</button>
        </div>
        <div id="forgot-status" aria-live="polite" style="margin-top:10px;font-size:13px;display:none;"></div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <script type="module" src="Firebase.js"></script>
  <script type="module" src="forgot.js"></script>

  <script>
    function validateForm() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!username || !password) {
        document.getElementById("login-error").style.display = "block";
        return false;
      }
      alert("Form submitted successfully");
      return true;
    }
  </script>

</body>

</html>
