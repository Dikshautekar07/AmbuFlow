<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register & Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <link rel="shortcut icon" href="ambulance.png" type="image/x-icon" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2575fc, #ffffff);
    }

    .container {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 35px;
      width: 370px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .container h2 {
      text-align: center;
      color: #003366;
      margin-bottom: 25px;
    }

    .input-field {
      position: relative;
      margin: 15px 0;
    }

    .input-field i {
      position: absolute;
      left: 10px;
      top: 12px;
      color: #003366;
    }

    .input-field input {
      width: 100%;
      padding: 12px 12px 12px 35px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.8);
      color: #003366;
      font-size: 15px;
    }

    .form-check {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }

    .form-check-input {
      margin-right: 8px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2575fc;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #005ce6;
    }

    .social-text {
      text-align: center;
      margin: 20px 0 10px;
      color: #003366;
      font-size: 14px;
    }

    .social-media {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .social-icon {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: 0.3s;
    }

    .social-icon:hover {
      background: rgba(255, 255, 255, 0.9);
    }

    #login-error {
      color: red;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>User Login / Sign Up</h2>
    <form onsubmit="return validateForm()">
      <div class="input-field">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Username" required />
      </div>
      <div class="input-field">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="Email (for Sign Up)" />
      </div>
      <div class="input-field">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" required />
      </div>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="remember-me" />
        <label for="remember-me">Remember me</label>
      </div>
      <input type="submit" value="Continue" class="btn" />
      <div id="login-error">Invalid credentials. Try again.</div>

      <p class="social-text">Or continue with</p>
      <div class="social-media">
        <div class="social-icon"><i class="fab fa-google" style="color: #4285F4; font-size: 22px;"></i></div>
        <div class="social-icon"><i class="fab fa-facebook-f" style="color: #4267b2; font-size: 22px;"></i></div>
        <div class="social-icon"><i class="fab fa-github" style="color: #333; font-size: 22px;"></i></div>
      </div>
    </form>
  </div>

  <script>
    function validateForm() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!username || !password) {
        document.getElementById("login-error").style.display = "block";
        return false;
      }
      alert("Form submitted successfully!");
      return true;
    }
  </script>
</body>

</html>
